<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Princess' Prequel">
<meta name="theme-color" content="#260a25">
<title>Princess' Prequel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&family=VT323&display=swap">
<style>
/* Layout: one-screen camera-app shell — header bar, photo stage that flexes, bottom tool panel (controls → strip → tabs). Single deliberate dark look, like every photo editor. */
:root{
  --ink:#260a25;      /* stage background */
  --panel:#1b181f;    /* tool panel */
  --raise:#28242d;    /* chips, inputs */
  --line:#37323d;
  --text:#f2eff3;
  --mute:#9d96a5;
  --accent:#ff66f5;   /* pink for princess */
  --accent-ink:#1c170c;
  --stamp:#ff8a2b;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overscroll-behavior:none}
body{font-family:var(--f-display);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,label.btn{font:inherit;color:inherit;touch-action:manipulation}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}

.app{height:100%;height:100dvh;display:flex;flex-direction:column;min-height:0}

/* header */
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.brand{font-weight:700;font-size:16px;letter-spacing:-.02em;flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variation-settings:"opsz" 96}
@media (max-width:430px){.bar .lbl{display:none}.bar label.btn{width:42px;padding:0;justify-content:center}.bar{gap:6px}}
.brand span{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:999px;background:var(--raise);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--text)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg,.btn svg{width:20px;height:20px}
.save{background:var(--accent);color:var(--accent-ink)}
.left,.right{display:flex;align-items:center;gap:4px;flex:none}

/* stage */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:4px 16px 12px}
#view{display:block;border-radius:4px;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.stage.cropmode #view{cursor:grab;outline:1px dashed var(--accent);outline-offset:3px}
.badge{position:absolute;top:12px;left:28px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(19,17,22,.72);padding:5px 9px;border-radius:999px;color:var(--mute);pointer-events:none}
.cmp{position:absolute;right:26px;top:12px;height:34px;padding:0 12px;border-radius:999px;background:rgba(19,17,22,.72);color:var(--text);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cmp svg{width:16px;height:16px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:var(--ink);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s;opacity:0;pointer-events:none}
.toast.on{opacity:1}

/* panel */
.panel{flex:none;background:var(--panel);border-radius:18px 18px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.ctrl{min-height:82px;padding:14px 16px 6px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.srow{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:12px}
.srow .lab{font-size:13px;color:var(--mute);font-weight:500;user-select:none;-webkit-user-select:none}
.srow .val{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--mute);font-size:13px;text-align:center}
.ctrl .tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mini{height:38px;padding:0 12px;border-radius:999px;background:var(--raise);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mini svg{width:15px;height:15px}
.textin{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--text);padding:0 12px;font-family:"VT323",var(--f-mono);font-size:22px;letter-spacing:.06em}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line) 0 var(--a),var(--accent) var(--a) var(--b),var(--line) var(--b))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line) 0 var(--a),var(--accent) var(--a) var(--b),var(--line) var(--b))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--text);margin-top:-12px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--text)}

.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.item{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;scroll-snap-align:start;padding:0}
.item .face{width:66px;height:66px;border-radius:14px;background:var(--raise);display:grid;place-items:center;position:relative;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.item canvas{width:100%;height:100%;display:block}
.item svg{width:26px;height:26px;color:var(--text)}
.item .nm{font-size:12px;color:var(--mute);font-weight:500;white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.item.sel .face{border-color:var(--accent)}
.item.sel .nm{color:var(--text);font-weight:600}
.item .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.item.round .face{border-radius:50%}
.item.round .dot{top:10px;right:10px}

.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;height:52px;font-size:14px;font-weight:600;color:var(--mute);border-radius:10px;letter-spacing:.01em}
.tab.on{color:var(--text)}
.tab.on::after{content:"";display:block;width:16px;height:3px;border-radius:2px;background:var(--accent);margin:4px auto 0}

/* save sheet */
.sheet{position:fixed;inset:0;background:rgba(8,7,10,.78);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:env(safe-area-inset-top,0px) 0 0}
.card{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;min-height:0}
.card header{display:flex;align-items:center;justify-content:space-between}
.card h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.card .imgwrap{min-height:0;flex:1;display:grid;place-items:center;overflow:hidden}
.card img{max-height:52vh;max-width:100%;border-radius:6px;-webkit-touch-callout:default;user-select:auto}
.card p{margin:0;color:var(--mute);font-size:13px;line-height:1.45;text-align:center;text-wrap:balance}
.card .row{display:flex;gap:8px}
.card .row .btn{flex:1;justify-content:center;height:46px}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,7,10,.6);z-index:11;font-weight:600}
.err{padding:40px 16px;text-align:center;color:var(--mute)}
@media (min-width:760px){.strip{justify-content:safe center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="left">
      <label class="btn" for="file" aria-label="Open photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg><span class="lbl">Open</span></label>
      <input id="file" class="vh" type="file" accept="image/*">
    </div>
    <div class="brand">Princess' <span>Prequel</span></div>
    <div class="right">
      <button class="icon-btn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon-btn" id="redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn save" id="save">Save</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="Photo preview"></canvas>
    <div class="badge" id="badge">Sample photo</div>
    <button class="cmp" id="cmp" aria-label="Hold to see the original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/><path d="M3 4h9v16H3z" fill="currentColor"/></svg>Hold for original</button>
    <div class="toast" id="toast"></div>
  </main>

  <section class="panel">
    <div class="ctrl" id="ctrl"></div>
    <div class="strip" id="strip"></div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="filters">Filters</button>
      <button class="tab" data-tab="effects">Effects</button>
      <button class="tab" data-tab="adjust">Adjust</button>
      <button class="tab" data-tab="crop">Crop</button>
      <button class="tab" data-tab="text">Date</button>
    </nav>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-label="Save photo">
    <header><h2>Ready to save</h2><button class="icon-btn" id="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="imgwrap"><img id="outImg" alt="Edited photo"></div>
    <p id="outInfo">Press and hold the photo, then tap <b>Save to Photos</b>. Or use the button below.</p>
    <div class="row"><button class="btn save" id="saveFile">Save file</button></div>
  </div>
</div>
<div class="busy" id="busy" hidden>Rendering full size…</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);

/* ---------- presets, effects, adjustments ---------- */
const Z=[0,0,0];
const PRESETS=[
 {id:"original",name:"Original",g:{},fx:{}},
 {id:"sunkissed",name:"Sunkissed",g:{sh:[.03,.01,-.03],hi:[.06,.03,-.04],sat:.1,con:.08,fade:.03,temp:.3},fx:{grain:.25}},
 {id:"pastel",name:"Pastel",g:{sh:[.02,.03,.06],hi:[.04,.02,.03],sat:-.18,con:-.15,fade:.12,temp:.05},fx:{glow:.25}},
 {id:"evergreen",name:"Evergreen",g:{sh:[-.03,.04,.02],hi:[.03,.02,-.02],sat:-.05,con:.1,fade:.06,temp:-.05},fx:{grain:.3}},
 {id:"disposable",name:"Disposable",g:{sh:[0,.02,.04],hi:[.07,.04,-.03],sat:.15,con:.2,fade:.04,temp:.2},fx:{vig:.55,grain:.4},stamp:true},
 {id:"camcorder",name:"Camcorder",g:{sh:[.02,-.01,.05],hi:[.03,.02,0],sat:-.1,con:.05,fade:.1},fx:{vhs:.7,split:.2}},
 {id:"haze",name:"Haze",g:{hi:[.05,.02,.05],sat:-.05,con:-.1,fade:.08},fx:{glow:.65,split:.25,leak:.3}},
 {id:"y2k",name:"Y2K",g:{sh:[-.02,0,.06],hi:[.02,.04,.08],sat:.05,con:.15,temp:-.3},fx:{glow:.35,split:.15}},
 {id:"cinema",name:"Cinema",g:{sh:[-.04,.03,.07],hi:[.07,.03,-.04],sat:.05,con:.18,fade:.02},fx:{vig:.35,grain:.15}},
 {id:"noir",name:"Noir",g:{mono:1,con:.35,fade:.02},fx:{grain:.45,vig:.4,dust:.3}},
 {id:"lomo",name:"Lomo",g:{sh:[0,0,.06],hi:[.05,.05,-.05],sat:.35,con:.35},fx:{vig:.8}},
 {id:"faded",name:"Faded",g:{sh:[.03,.03,.05],hi:[.02,.02,0],sat:-.25,con:-.1,fade:.2},fx:{grain:.3,dust:.25}},
 {id:"instant",name:"Instant",g:{sh:[-.02,.04,.05],hi:[.06,.04,0],sat:-.1,con:-.05,fade:.15,temp:.1},fx:{vig:.3,leak:.2}},
 {id:"glitch",name:"Glitch",g:{sh:[.02,-.02,.05],sat:.1,con:.15},fx:{glitch:.6,split:.45,vhs:.25}}
];
const PMAP=Object.fromEntries(PRESETS.map(p=>[p.id,p]));

const I=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const FX=[
 {id:"grain",name:"Grain",icon:I('<circle cx="6" cy="7" r="1" fill="currentColor"/><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="18" cy="8" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/><circle cx="6" cy="17" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/><circle cx="18" cy="17" r="1" fill="currentColor"/>'),sl:[["grain","Amount"],["grainSize","Size"]]},
 {id:"vhs",name:"VHS",icon:I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9h12M6 12h8M6 15h12"/>'),sl:[["vhs","Amount"]],seed:"v"},
 {id:"glitch",name:"Glitch",icon:I('<path d="M4 6h10M8 10h12M3 14h9M10 18h10"/>'),sl:[["glitch","Amount"]],seed:"g"},
 {id:"split",name:"Prism",icon:I('<circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/>'),sl:[["split","Amount"],["splitAng","Angle"]]},
 {id:"leak",name:"Light leak",icon:I('<circle cx="20" cy="12" r="6"/><path d="M11 12H4M12 6 7 3M12 18l-5 3"/>'),sl:[["leak","Amount"]],seed:"l"},
 {id:"dust",name:"Dust",icon:I('<circle cx="7" cy="8" r="1.5"/><circle cx="16" cy="15" r="1"/><circle cx="9" cy="17" r=".8" fill="currentColor"/><path d="M15 3c-1 6 1 10 0 18"/>'),sl:[["dust","Amount"]],seed:"d"},
 {id:"glow",name:"Glow",icon:I('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/><circle cx="12" cy="12" r="2"/>'),sl:[["glow","Amount"]]},
 {id:"vig",name:"Vignette",icon:I('<rect x="3" y="4" width="18" height="16" rx="2"/><ellipse cx="12" cy="12" rx="6" ry="5"/>'),sl:[["vig","Amount"]]}
];
const ADJ=[
 {id:"exposure",name:"Exposure",bi:1,icon:I('<circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M7 11h3M15 13h2"/>')},
 {id:"contrast",name:"Contrast",bi:1,icon:I('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>')},
 {id:"highlights",name:"Highlights",bi:1,icon:I('<circle cx="12" cy="12" r="8"/><path d="M5 9h14M7 6h10" />')},
 {id:"shadows",name:"Shadows",bi:1,icon:I('<circle cx="12" cy="12" r="8"/><path d="M5 15h14M7 18h10"/>')},
 {id:"saturation",name:"Saturation",bi:1,icon:I('<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>')},
 {id:"warmth",name:"Warmth",bi:1,icon:I('<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/>')},
 {id:"tint",name:"Tint",bi:1,icon:I('<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>')},
 {id:"fade",name:"Fade",bi:0,icon:I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M13 5v14" stroke-dasharray="2 2"/>')},
 {id:"sharpen",name:"Sharpen",bi:0,icon:I('<path d="M12 3 21 20H3z"/>')}
];
const RATIOS=[["orig","Original",null],["1:1","Square",1],["4:5","4:5",.8],["3:4","3:4",.75],["9:16","Story",9/16],["16:9","Wide",16/9]];
const STAMP_COLORS=[["orange","#ff8a2b","#ff5a00"],["red","#ff4a3a","#ff1a0a"],["cream","#fff3d6","#ffcf7a"]];

function today(){const d=new Date();return "'"+String(d.getFullYear()).slice(2)+" "+(d.getMonth()+1)+" "+d.getDate();}
function fresh(){return{
  preset:"original",strength:1,
  adjust:{exposure:0,contrast:0,highlights:0,shadows:0,saturation:0,warmth:0,tint:0,fade:0,sharpen:0},
  fx:{grain:0,grainSize:.35,vhs:0,glitch:0,split:0,splitAng:0,leak:0,dust:0,glow:0,vig:0},
  seeds:{v:.31,g:.57,l:.23,d:.71,n:.13},
  crop:{ratio:"orig",cx:.5,cy:.5,rot:0,flip:false},
  stamp:{on:false,text:today(),color:"orange"}
};}
let state=fresh();
const ui={tab:"filters",fx:"grain",adj:"exposure",compare:false};

/* ---------- WebGL ---------- */
const view=$("#view"),vctx=view.getContext("2d");
const glc=document.createElement("canvas");
const gl=glc.getContext("webgl",{preserveDrawingBuffer:true,antialias:false,premultipliedAlpha:false})||glc.getContext("experimental-webgl",{preserveDrawingBuffer:true});
if(!gl){$("#stage").innerHTML='<div class="err">This browser can’t run the editor (WebGL is off). Try Safari or Chrome.</div>';return;}

const VS=`attribute vec2 a;varying vec2 vUv;void main(){vUv=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}`;
const FS=`precision highp float;
varying vec2 vUv;uniform sampler2D uTex;uniform vec4 uCrop;uniform float uRot,uFlip;uniform vec2 uOut;
uniform float uExp,uCon,uSat,uWarm,uTint,uHi,uSh,uFade,uSharp;
uniform float uStr,uGSat,uGCon,uGFade,uGTemp,uGMono;uniform vec3 uGShadow,uGHigh;
uniform float uGrain,uGrainSize,uVhs,uGlitch,uSplit,uSplitAng,uLeak,uDust,uGlow,uVig;
uniform float uSeedV,uSeedG,uSeedL,uSeedD,uSeedN;
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h12(i),h12(i+vec2(1.,0.)),f.x),mix(h12(i+vec2(0.,1.)),h12(i+vec2(1.,1.)),f.x),f.y);}
vec2 toSrc(vec2 uv){uv=clamp(uv,0.,1.);if(uFlip>.5)uv.x=1.-uv.x;vec2 c=uv;
 if(uRot>.5&&uRot<1.5)c=vec2(uv.y,1.-uv.x);else if(uRot>1.5&&uRot<2.5)c=1.-uv;else if(uRot>2.5)c=vec2(1.-uv.y,uv.x);
 return uCrop.xy+c*uCrop.zw;}
vec3 img(vec2 uv){return texture2D(uTex,toSrc(uv)).rgb;}
float lu(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
void main(){
 vec2 uv=vUv;float asp=uOut.x/uOut.y;
 if(uVhs>0.){
  float w=sin(uv.y*90.+uSeedV*20.)*.0015+sin(uv.y*13.+uSeedV*7.)*.002;
  float band=fract(uSeedV*3.1+.2);float bd=exp(-pow((uv.y-band)*30.,2.));
  uv.x+=uVhs*(w+bd*.012*(h12(vec2(floor(uv.y*400.),uSeedV))-.3));
 }
 float gr=0.;
 if(uGlitch>0.){
  float rows=floor(uv.y*mix(10.,40.,h12(vec2(uSeedG,3.))));
  if(h12(vec2(rows,uSeedG*13.))<uGlitch*.55){gr=1.;uv.x+=(h12(vec2(rows,uSeedG*7.+1.))-.5)*.18*uGlitch;}
  vec2 bc=floor(uv*vec2(12.,20.));

}
$("#file").addEventListener("change",async e=>{
 const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
 const url=URL.createObjectURL(f);const im=new Image();
 try{
  await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url;});
  setImage(toCanvas(im,im.naturalWidth,im.naturalHeight));
  state.crop=fresh().crop;commit();
  $("#badge").hidden=true;renderThumbs();buildAll();schedule();
  if(Math.max(im.naturalWidth,im.naturalHeight)>MAXT)toast(`Large photo scaled to ${Math.max(srcW,srcH)}px on the long edge`);
 }catch(err){toast("That file couldn’t be opened. Try a JPG, PNG or HEIC photo.");}
 finally{URL.revokeObjectURL(url);}
});

/* ---------- sample photo (drawn, so the editor opens with something to edit) ---------- */
function makeSample(){
 const W=1500,H=1875,hz=H*.6,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 let g=x.createLinearGradient(0,0,0,hz);[[0,"#1f2a5e"],[.35,"#6c3f80"],[.62,"#e0646a"],[.82,"#f6a35c"],[1,"#ffd894"]].forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,W,hz);
 const sx=W*.62,sy=hz-70;
 g=x.createRadialGradient(sx,sy,0,sx,sy,620);g.addColorStop(0,"rgba(255,214,150,.75)");g.addColorStop(1,"rgba(255,170,120,0)");x.fillStyle=g;x.fillRect(0,0,W,hz);
 x.fillStyle="#fff1c4";x.beginPath();x.arc(sx,sy,120,0,Math.PI*2);x.fill();
 for(let i=0;i<5;i++){x.fillStyle=`rgba(255,200,170,${.12+i*.03})`;x.beginPath();x.ellipse(200+i*330,hz*.32+i*40,260,26,0,0,7);x.fill();}
 x.fillStyle="#4a2f52";x.beginPath();x.moveTo(0,hz);for(let i=0;i<=W;i+=20)x.lineTo(i,hz-30-Math.max(0,Math.sin(i/260)*60)-(i>W*.75?(i-W*.75)*.35:0));x.lineTo(W,hz);x.fill();
 g=x.createLinearGradient(0,hz,0,H);[[0,"#f0a066"],[.25,"#9a5574"],[.6,"#2e2550"],[1,"#141327"]].forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,hz,W,H-hz);
 for(let y=hz+4;y<H;y+=6+(y-hz)*.03){const k=(y-hz)/(H-hz),w=(160+k*500)*(.5+Math.random()*.8);x.fillStyle=`rgba(255,226,170,${(1-k)*.55*Math.random()})`;x.fillRect(sx-w/2+(Math.random()-.5)*k*200,y,w,2+k*5);}
 for(let i=0;i<120;i++){const y=hz+Math.random()*(H-hz),k=(y-hz)/(H-hz);x.fillStyle=`rgba(20,16,40,${.15+k*.3})`;x.fillRect(Math.random()*W,y,30+k*160,1+k*3);}
 x.fillStyle="#120d18";x.beginPath();x.moveTo(0,H);x.lineTo(0,H*.86);x.quadraticCurveTo(W*.25,H*.83,W*.5,H*.9);x.quadraticCurveTo(W*.7,H*.95,W,H*.93);x.lineTo(W,H);x.fill();
 const bx=W*.14,by=H*.88,tx=W*.27,ty=H*.36;x.beginPath();x.moveTo(bx-22,by);x.quadraticCurveTo(W*.13,H*.6,tx-8,ty);x.lineTo(tx+8,ty);x.quadraticCurveTo(W*.16,H*.6,bx+22,by);x.fill();
 const fr=[[-2.7,330],[-2.2,360],[-1.6,300],[-.9,340],[-.4,360],[.15,320],[.6,280],[2.5,260]];
 fr.forEach(([a,l])=>{const ex=tx+Math.cos(a)*l,ey=ty+Math.sin(a)*l*.6+Math.abs(Math.cos(a))*l*.35;const mx=tx+Math.cos(a)*l*.5,my=ty+Math.sin(a)*l*.5-40;
  x.beginPath();x.moveTo(tx,ty);x.quadraticCurveTo(mx,my-28,ex,ey);x.quadraticCurveTo(mx,my+20,tx,ty);x.fill();
  for(let s=.25;s<.95;s+=.09){const px=tx+(ex-tx)*s,py=ty+(ey-ty)*s-Math.sin(s*Math.PI)*30;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a+1.4)*40*(1-s),py+38*(1-s)+10);x.lineTo(px+Math.cos(a)*14,py+6);x.fill();}});
 return c;
}

/* ---------- save ---------- */
const dlP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
let out={blob:null,url:"",name:""};
$("#save").onclick=async()=>{
 if(!srcCanvas)return;$("#busy").hidden=false;
 await new Promise(r=>setTimeout(r,30));
 try{try{await document.fonts.load('40px VT323');}catch(e){}
  const ci=cropInfo(state.crop);let w=Math.round(ci.outW),h=Math.round(ci.outH);
  glDraw(w,h,uniformsFor(state,false),ci.rect,state.crop.rot,state.crop.flip);
  const oc=document.createElement("canvas");oc.width=w;oc.height=h;const ox=oc.getContext("2d");ox.drawImage(glc,0,0);drawStamp(ox,w,h,state.stamp);
  const blob=await new Promise(r=>oc.toBlob(r,"image/jpeg",.95));
  if(!blob)throw new Error("encode");
  if(out.url)URL.revokeObjectURL(out.url);
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  out={blob,url:URL.createObjectURL(blob),name:`princessprequel-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`};
  $("#outImg").src=out.url;
  $("#outInfo").innerHTML=`${w} × ${h} JPG. On iPhone, press and hold the photo, then tap <b>Save to Photos</b>. Or use the button below.`;
  $("#sheet").hidden=false;
 }catch(e){toast("Couldn’t render that size. Try a smaller crop.");}
 finally{$("#busy").hidden=true;schedule();}
};
$("#closeSheet").onclick=()=>{$("#sheet").hidden=true;};
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("#sheet").hidden=true;});
$("#saveFile").onclick=async()=>{
 if(!out.blob)return;
 const dl=await dlP;
 if(dl){try{const r=await dl.save({filename:out.name,data:out.blob});if(r&&r.status==="saved")toast("Saved");return;}
  catch(e){if(e&&(e.code==="declined"||e.code==="rate_limited"))return;}}
 try{const file=new File([out.blob],out.name,{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}
 catch(e){if(e&&e.name==="AbortError")return;}
 const a=document.createElement("a");a.href=out.url;a.download=out.name;document.body.appendChild(a);a.click();a.remove();
 toast("If nothing saved, press and hold the photo instead.");
};

/* ---------- start ---------- */
setImage(makeSample());
state.preset="disposable";state.fx=Object.assign(fresh().fx,PMAP.disposable.fx);state.stamp.on=true;
renderThumbs();commit();buildAll();schedule();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
})();
</script>
